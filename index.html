<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluación Automática de Ensayos por Nivel Académico</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        :root { --primary: #2563eb; --primary-hover: #1d4ed8; --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; }
        body { font-family: system-ui, -apple-system, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 900px; width: 100%; background: var(--surface); padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        h1 { text-align: center; color: #1e293b; margin-bottom: 6px; font-size: 1.5rem; }
        p.subtitle { text-align: center; color: #64748b; margin-top: 0; margin-bottom: 20px; font-size: 0.9rem; }
        .config-card { background: #eff6ff; border: 1px dashed #93c5fd; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .form-group { margin-bottom: 12px; }
        label { font-size: 0.85rem; font-weight: bold; color: #334155; display: block; margin-bottom: 4px; }
        input[type="password"], select { width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; box-sizing: border-box; }
        .upload-section { background: #f1f5f9; border: 2px dashed #cbd5e1; border-radius: 8px; padding: 15px; text-align: center; margin-bottom: 15px; }
        .btn-eval { background-color: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: bold; width: 100%; margin-top: 10px; }
        .btn-eval:hover { background-color: var(--primary-hover); }
        .btn-eval:disabled { background-color: #94a3b8; cursor: not-allowed; }
        .status-msg { margin-top: 8px; font-size: 0.85rem; color: #475569; font-weight: 500; }
        .canvas-container { width: 100%; overflow-x: auto; display: flex; justify-content: center; margin-bottom: 15px; }
        canvas { border-radius: 8px; }
        .results-panel { background: #f1f5f9; padding: 15px; border-radius: 8px; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; text-align: center; margin-bottom: 15px; }
        .metric { background: white; padding: 10px; border-radius: 6px; }
        .metric-title { font-size: 0.75rem; color: #64748b; text-transform: uppercase; font-weight: bold; }
        .metric-value { font-size: 1.25rem; font-weight: bold; color: var(--primary); margin-top: 2px; }
        .feedback-card { background: #fffbe3; border: 1px solid #ffe58f; padding: 15px; border-radius: 8px; font-size: 0.9rem; line-height: 1.5; }
    </style>
</head>
<body>

<div class="container">
    <h1>Rúbrica Avanzada de Evaluación de Ensayos</h1>
    <p class="subtitle">Evaluación automática por IA con ajuste de rigor académico</p>

    <div class="config-card">
        <div class="form-group">
            <label for="apiKey">Clave API de Gemini (Google AI Studio):</label>
            <input type="password" id="apiKey" placeholder="Pega aquí tu API Key (ej. AIzaSy...)">
        </div>
        <div class="form-group">
            <label for="academicLevel">Nivel Académico del Grupo:</label>
            <select id="academicLevel">
                <option value="Licenciatura">Licenciatura</option>
                <option value="Maestría" selected>Maestría</option>
                <option value="Doctorado">Doctorado</option>
            </select>
        </div>
    </div>

    <div class="upload-section">
        <input type="file" id="fileInput" accept=".pdf">
        <button class="btn-eval" id="evalBtn" onclick="procesarYEvaluar()" disabled>⚡ Evaluar Ensayo con IA</button>
        <div class="status-msg" id="status">Selecciona un archivo PDF para comenzar</div>
    </div>

    <div class="canvas-container">
        <canvas id="rubricCanvas" width="860" height="580"></canvas>
    </div>

    <div class="results-panel">
        <div class="metric"><div class="metric-title">Puntaje Total</div><div class="metric-value" id="totalScore">0 / 32</div></div>
        <div class="metric"><div class="metric-title">Calificación Decimal</div><div class="metric-value" id="decimalScore">0.0 / 10</div></div>
        <div class="metric"><div class="metric-title">Nivel Alcanzado</div><div class="metric-value" id="performanceLevel">Pendiente</div></div>
    </div>

    <div class="feedback-card" id="feedbackBox">
        <strong>Dictamen Cualitativo de la IA:</strong> Ingresa tu API Key y evalúa un PDF.
    </div>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    const canvas = document.getElementById('rubricCanvas');
    const ctx = canvas.getContext('2d');
    const fileInput = document.getElementById('fileInput');
    const statusDisplay = document.getElementById('status');
    const apiKeyInput = document.getElementById('apiKey');

    const criteria = ["1. Tesis y Postura Teórica", "2. Estructura y Coherencia", "3. Argumentación y Análisis", "4. Fundamentación y Fuentes", "5. Citas y Normas (APA/IEEE)", "6. Sintaxis y Estilo Académico", "7. Aporte y Crítica Propia", "8. Conclusiones y Propuesta"];
    const levels = [{ name: "Excelente", pts: 4 }, { name: "Bueno", pts: 3 }, { name: "Aceptable", pts: 2 }, { name: "Deficiente", pts: 1 }];
    let selections = new Array(criteria.length).fill(0);
    let extractedText = "";

    fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        statusDisplay.innerText = "Leyendo el documento PDF...";
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        extractedText = "";
        for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();
            extractedText += content.items.map(item => item.str).join(" ") + "\n";
        }
        statusDisplay.innerText = `📄 Documento listo (${pdf.numPages} páginas leídas).`;
        document.getElementById('evalBtn').disabled = false;
    });

    async function procesarYEvaluar() {
        const apiKey = apiKeyInput.value.trim();
        if (!apiKey) return alert("Por favor ingresa tu API Key.");
        const level = document.getElementById('academicLevel').value;

        statusDisplay.innerText = "Analizando ensayo con Gemini 3.6 Flash...";
        
        // Se utiliza gemini-3.6-flash en el endpoint
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`;

        const promptText = `Actúa como evaluador académico nivel ${level}. Evalúa este texto en los 8 criterios (1 a 4 puntos cada uno).
Responde en JSON estricto: {"puntajes": [4,3,4,2,3,4,3,4], "retroalimentacion": "Dictamen aquí"}
Texto: ${extractedText.substring(0, 14000)}`;

        try {
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
            });

            const resJson = await response.json();
            if (resJson.error) throw new Error(resJson.error.message);

            let rawText = resJson.candidates[0].content.parts[0].text.replace(/```json/g, '').replace(/```/g, '').trim();
            const parsed = JSON.parse(rawText);

            selections = parsed.puntajes;
            document.getElementById('feedbackBox').innerHTML = `<strong>Dictamen Cualitativo (${level}):</strong><br>${parsed.retroalimentacion}`;
            statusDisplay.innerText = "¡Evaluación completada!";
            draw();
            updateScore();
        } catch (err) {
            statusDisplay.innerText = "Error: " + err.message;
        }
    }

    const margin = 5, headerHeight = 45, rowHeaderWidth = 220;
    const cellWidth = (canvas.width - rowHeaderWidth - margin * 2) / 4;
    const rowHeight = (canvas.height - headerHeight - margin * 2) / criteria.length;

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#1e293b"; ctx.fillRect(rowHeaderWidth, margin, cellWidth * 4, headerHeight);

        levels.forEach((level, i) => {
            ctx.fillStyle = "#ffffff"; ctx.font = "bold 13px system-ui"; ctx.textAlign = "center";
            ctx.fillText(`${level.name} (${level.pts} pts)`, rowHeaderWidth + i * cellWidth + cellWidth / 2, margin + headerHeight / 2);
        });

        criteria.forEach((criterion, rowIndex) => {
            const y = margin + headerHeight + rowIndex * rowHeight;
            ctx.fillStyle = "#f8fafc"; ctx.fillRect(margin, y, rowHeaderWidth, rowHeight);
            ctx.fillStyle = "#0f172a"; ctx.font = "bold 11px system-ui"; ctx.textAlign = "left";
            ctx.fillText(criterion, margin + 8, y + rowHeight / 2);

            levels.forEach((level, colIndex) => {
                const x = rowHeaderWidth + colIndex * cellWidth;
                const isSelected = selections[rowIndex] === level.pts;
                ctx.fillStyle = isSelected ? "#dbeafe" : "#ffffff"; ctx.fillRect(x, y, cellWidth, rowHeight);
                ctx.strokeStyle = isSelected ? "#2563eb" : "#e2e8f0"; ctx.strokeRect(x, y, cellWidth, rowHeight);
                ctx.fillStyle = isSelected ? "#1d4ed8" : "#64748b"; ctx.textAlign = "center";
                ctx.fillText(isSelected ? `✓ ${level.pts} Pts` : `${level.pts} pts`, x + cellWidth / 2, y + rowHeight / 2);
            });
        });
    }

    function updateScore() {
        const total = selections.reduce((a, b) => a + b, 0);
        document.getElementById('totalScore').innerText = `${total} / 32`;
        document.getElementById('decimalScore').innerText = `${((total / 32) * 10).toFixed(1)} / 10`;
    }

    draw();
</script>
</body>
</html>
